<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    SITE LINKS: the three Beyondcy sites, in ONE place. Nothing on this page links to them yet;
    copy an address from here when a link is added. When the domain is connected
    (11_CONNECT_DOMAIN.md), change these three to https://beyondcy.co/,
    https://dash.beyondcy.co/ and https://track.beyondcy.co/.
      site   https://beyondcy888.github.io/beyondcy.co/
      dash   https://beyondcy888.github.io/beyondcy.co-dash/    (this page)
      track  https://beyondcy888.github.io/beyondcy.co-track/
    Files on this page use relative paths (favicon.ico, logo-beyondcy.png): no leading "/".
  -->
  <title>Beyondcy Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The Beyondcy marketing dashboard is being built. Each brand's performance reports will live here.">
  <meta name="theme-color" content="#131218">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #131218;
      --line: #2F2E39;
      --text: #EEECF4;
      --text-dim: #9A96AB;
      --dot: #313d27;              /* dim green grid */
      --not-started: #6F6C7D;
      --planned: #4D8DFF;
      --uploaded: #9ECD59;         /* the Beyondcy green */
      --gap: 24px;                 /* dot grid spacing */
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--ink);
      color: var(--text);
      font-family: "Instrument Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 6vw, 88px);
    }
    .logo {
      display: block;
      width: auto;
      height: 30px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-block: clamp(48px, 10vh, 120px) clamp(32px, 6vh, 64px);
      max-width: 1400px;
    }
    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(3.5rem, 9vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }
    p {
      margin: 20px 0 0;
      max-width: 34rem;
      font-size: clamp(1rem, 1.6vw, 1.125rem);
      line-height: 1.55;
      color: var(--text-dim);
    }
    /* the dot band: a dim green grid with a few dots in the status colours */
    .band {
      position: relative;
      height: calc(var(--gap) * 4);
      margin-top: clamp(40px, 7vh, 72px);
      background-image: radial-gradient(circle at center, var(--dot) 1.6px, transparent 2.2px);
      background-size: var(--gap) var(--gap);
      overflow: hidden;
    }
    .band i {
      position: absolute;
      left: calc(var(--x) * var(--gap) + var(--gap) / 2 - 5px);
      top: calc(var(--y) * var(--gap) + var(--gap) / 2 - 5px);
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .band .u { background: var(--uploaded); }
    .band .p { box-shadow: inset 0 0 0 2px var(--planned); }
    .band .n { width: 6px; height: 6px; margin: 2px; background: var(--not-started); }
    @media (prefers-reduced-motion: no-preference) {
      .band i { animation: breathe 6s ease-in-out infinite; animation-delay: calc(var(--x) * -0.4s); }
      @keyframes breathe { 50% { opacity: 0.45; } }
    }
    footer {
      font-size: 0.875rem;
      color: var(--text-dim);
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }
    /* MAINTENANCE: the check holds the page back for at most ~1.2 s, so it doesn't flash */
    html.is-checking body > header,
    html.is-checking body > main,
    html.is-checking body > footer { visibility: hidden; }
    html.is-maintenance body { overflow: hidden; }
    #maintenance {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow-y: auto;
      background: var(--ink);
    }
    #maintenance[hidden] { display: none; }
    /* a copy on this computer (localhost) ignores maintenance and shows this note instead */
    .maintenance-note {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 5;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 8px 14px;
      border: 1px solid #c2459a;
      border-radius: 999px;
      background: #2a1d2c;
      color: var(--text);
      font-size: 0.8125rem;
      text-align: center;
    }
  </style>
  <script>
    // MAINTENANCE: hold the page back while the switch is read, at most 1.2 s. The failsafe is here,
    // not in the module below, so the page still shows if that script can't load.
    document.documentElement.classList.add('is-checking');
    setTimeout(function () { document.documentElement.classList.remove('is-checking'); }, 1200);
  </script>
</head>
<body>
  <header><img class="logo" src="logo-beyondcy.png" alt="Beyondcy" width="143" height="30"></header>

  <main>
    <!-- COPY: edit the headline and description here -->
    <h1>Stay tuned</h1>
    <p>The Beyondcy marketing dashboard is being built. Each brand's performance reports will live here.</p>
    <!-- /COPY -->

    <div class="band" aria-hidden="true">
      <i class="u" style="--x:3;--y:2"></i>
      <i class="p" style="--x:7;--y:2"></i>
      <i class="u" style="--x:11;--y:0"></i>
      <i class="n" style="--x:4;--y:3"></i>
      <i class="u" style="--x:15;--y:1"></i>
      <i class="u" style="--x:19;--y:1"></i>
      <i class="p" style="--x:23;--y:3"></i>
      <i class="u" style="--x:28;--y:2"></i>
      <i class="n" style="--x:33;--y:0"></i>
      <i class="p" style="--x:37;--y:1"></i>
      <i class="u" style="--x:42;--y:3"></i>
      <i class="u" style="--x:48;--y:1"></i>
      <i class="p" style="--x:53;--y:2"></i>
    </div>
  </main>

  <footer>© 2026 Beyondcy Kreatif Global</footer>

  <!--
    MAINTENANCE (tracker update v4, file 10 §3): while Dashboard maintenance is on, the maintenance
    page covers this page with a countdown, and it reopens by itself. Checked on load and every
    60 seconds. A failed check (offline, error) never locks anyone out: the normal page stays.
    No "Sign in" here: this site has no logins yet.
    maintenance/maintenance.js and maintenance/maintenance.css are byte-identical copies of the
    tracker repo's src/maintenance/page/ files: change them there and copy both here (keep them identical).
  -->
  <div id="maintenance" hidden></div>
  <script type="module">
    import { mountMaintenance } from './maintenance/maintenance.js';

    // Reading the maintenance switch is allowed for everyone; the publishable key is public by design.
    const SUPABASE_URL = 'https://hedinugzhxyssgxlkzfj.supabase.co';
    const PUBLISHABLE_KEY = 'sb_publishable_oe7glxmiVsOINldgECGvTg_0YADRGsk';
    const CHECK_EVERY = 60 * 1000;
    const FINISHING_RECHECK = 15 * 1000;
    const BACK_MS = 1600;
    const html = document.documentElement;
    const root = document.getElementById('maintenance');
    // A copy on this computer (localhost) ignores maintenance, so the agent doing the updates can
    // still open and check the page while it's on. Add ?maintenance-check to the address to see
    // the maintenance page locally. The live site is never on localhost.
    const LOCAL =
      ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname) && !new URLSearchParams(location.search).has('maintenance-check');
    let page = null;
    let finishingTimer = null;
    let css = null;
    let note = null;

    function localNote(on) {
      if (on && !note) {
        note = document.createElement('p');
        note.className = 'maintenance-note';
        note.setAttribute('role', 'status');
        note.textContent = 'Dashboard maintenance is on: everyone else sees the maintenance page. This copy on your computer ignores it.';
        document.body.append(note);
      } else if (!on && note) {
        note.remove();
        note = null;
      }
    }

    const ready = () => html.classList.remove('is-checking'); // (the <head> script also does this after 1.2 s)

    const loadCss = () =>
      (css ??= new Promise((resolve) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'maintenance/maintenance.css';
        link.onload = link.onerror = () => resolve();
        document.head.append(link);
      }));

    /** The dashboard's row, null when there is none, undefined when the check failed. */
    async function read() {
      try {
        const r = await fetch(`${SUPABASE_URL}/rest/v1/site_maintenance?site=eq.dashboard&select=is_on,ends_at`, {
          headers: { apikey: PUBLISHABLE_KEY },
          cache: 'no-store',
        });
        if (!r.ok) return undefined;
        const rows = await r.json();
        return rows[0] ?? null;
      } catch {
        return undefined;
      }
    }

    const active = (row) => Boolean(row && row.is_on && row.ends_at && Date.now() < Date.parse(row.ends_at));

    async function show(row) {
      clearTimeout(finishingTimer);
      await loadCss();
      if (page) {
        page.update({ endsAt: row.ends_at, state: 'counting' });
        return;
      }
      root.hidden = false;
      html.classList.add('is-maintenance');
      page = mountMaintenance(root, {
        site: 'Dashboard',
        endsAt: row.ends_at,
        state: 'counting',
        logoSrc: 'logo-beyondcy.png',
        signIn: null,
        onCountdownEnd: countdownEnded,
      });
      document.title = 'Maintenance · Beyondcy Dashboard';
    }

    function hide() {
      clearTimeout(finishingTimer);
      if (!page) return;
      page.update({ state: 'back' }); // "We're back!" for a moment
      setTimeout(() => {
        page?.destroy();
        page = null;
        root.hidden = true;
        html.classList.remove('is-maintenance');
        document.title = 'Beyondcy Dashboard';
      }, BACK_MS);
    }

    /** The countdown reached 0: off → back; still on (the timer runs once a minute) → "Finishing up…". */
    async function countdownEnded() {
      const row = await read();
      if (row === undefined) return; // the next check decides
      if (active(row)) return show(row); // time was added
      if (row && row.is_on) {
        page?.update({ state: 'finishing' });
        clearTimeout(finishingTimer);
        finishingTimer = setTimeout(countdownEnded, FINISHING_RECHECK);
        return;
      }
      hide();
    }

    async function check() {
      const row = await read();
      if (row !== undefined && LOCAL) {
        localNote(active(row));
      } else if (row !== undefined) {
        if (active(row)) await show(row);
        else if (page) {
          if (row && row.is_on) page.update({ state: 'finishing' });
          else hide();
        }
      }
      ready();
    }

    check();
    setInterval(check, CHECK_EVERY);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') check();
    });
  </script>
</body>
</html>
